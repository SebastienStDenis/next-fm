<!doctype html>
<meta charset="utf-8" />
<title>next.fm avatar</title>
<style>
  html,
  body {
    margin: 0;
    background: #000;
  }
  canvas {
    display: block;
  }
</style>
<canvas id="c"></canvas>
<script>
  // Renders one next.fm bot-account avatar. Query params:
  //   mode=light|dark   which side of the palette
  //   size=<px>         output edge length (default 1024)
  // The palette values mirror the tokens in frontend/src/app/globals.css; when
  // those change, re-derive here and regenerate.
  const params = new URLSearchParams(location.search);
  const mode = params.get("mode") === "dark" ? "dark" : "light";
  const SIZE = Number(params.get("size") || 1024);

  const PALETTE = {
    light: {
      background: "oklch(0.972 0.006 75)",
      primary: "oklch(0.44 0.055 45)",
    },
    dark: {
      background: "oklch(0.17 0.012 50)",
      primary: "oklch(0.76 0.072 70)",
    },
  }[mode];

  // The mark is the N of Array, the display face, which draws its letters as a
  // field of discrete dots - so the perforated look sits in the letterform and
  // the field behind it stays plain. Array is cut at 400 and 600 with nothing
  // between; 600 is the one that carries at the sizes an avatar is seen at.
  const FONT_FILE = "array-600.woff2";
  const WEIGHT = 600;
  // Proportion of the canvas edge, so any size renders identically. Set large
  // for a display face: the dots have to stay separated after the downscale to
  // ~180px, and a smaller setting lets neighbours antialias into each other
  // until the strokes go solid. It still clears the circle both services crop
  // avatars to by 9% of the edge.
  const CAP_RATIO = 0.58;

  const canvas = document.getElementById("c");
  canvas.width = SIZE;
  canvas.height = SIZE;
  canvas.style.width = SIZE + "px";
  canvas.style.height = SIZE + "px";
  const ctx = canvas.getContext("2d");

  // Centers on the N's own ink on both axes. Neither alignment does this by
  // itself: `alphabetic` sits the glyph on its baseline, and `center` centers
  // the advance width, which only matches the ink when the two sidebearings
  // are equal. Array's are 0 and 100, so trusting the advance hangs the mark a
  // visible step to the left of the tile.
  const drawMark = () => {
    let fontSize = SIZE;
    ctx.font = `${WEIGHT} ${fontSize}px Array`;
    const probe = ctx.measureText("N");
    const capAtProbe = probe.actualBoundingBoxAscent + probe.actualBoundingBoxDescent;
    fontSize = (CAP_RATIO * SIZE * fontSize) / capAtProbe;

    ctx.font = `${WEIGHT} ${fontSize}px Array`;
    ctx.textAlign = "center";
    ctx.textBaseline = "alphabetic";
    const m = ctx.measureText("N");
    const inkCenterY = (m.actualBoundingBoxDescent - m.actualBoundingBoxAscent) / 2;
    const inkCenterX = (m.actualBoundingBoxRight - m.actualBoundingBoxLeft) / 2;
    ctx.fillStyle = PALETTE.primary;
    ctx.fillText("N", SIZE / 2 - inkCenterX, SIZE / 2 - inkCenterY);
  };

  const render = () => {
    ctx.fillStyle = PALETTE.background;
    ctx.fillRect(0, 0, SIZE, SIZE);
    drawMark();
    document.title = "ready";
  };

  const font = new FontFace("Array", `url(${FONT_FILE}) format('woff2')`, {
    weight: String(WEIGHT),
  });
  font.load().then((loaded) => {
    document.fonts.add(loaded);
    render();
  });
</script>
