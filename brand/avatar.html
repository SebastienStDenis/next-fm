<!doctype html>
<meta charset="utf-8" />
<title>next.fm avatar</title>
<style>
  html,
  body {
    margin: 0;
    background: #000;
  }
  canvas {
    display: block;
  }
</style>
<canvas id="c"></canvas>
<script>
  // Renders one next.fm bot-account avatar. Query params:
  //   mode=light|dark    which side of the palette
  //   face=satoshi|array which typeface sets the N
  //   grille=on|off      the perforation field behind the mark
  //   size=<px>          output edge length (default 1024)
  //   cols, dot          grille pitch and perforation radius, for retuning
  // The palette values mirror the tokens in frontend/src/app/globals.css; when
  // those change, re-derive here and regenerate.
  const params = new URLSearchParams(location.search);
  const mode = params.get("mode") === "dark" ? "dark" : "light";
  const faceKey = params.get("face") === "array" ? "array" : "satoshi";
  const SHOW_GRILLE = params.get("grille") !== "off";
  const SIZE = Number(params.get("size") || 1024);
  const num = (key, fallback) =>
    params.has(key) ? Number(params.get(key)) : fallback;

  const PALETTE = {
    light: {
      background: "oklch(0.972 0.006 75)",
      primary: "oklch(0.44 0.055 45)",
    },
    dark: {
      background: "oklch(0.17 0.012 50)",
      primary: "oklch(0.76 0.072 70)",
    },
  }[mode];

  // Each face is sized by cap height, so the mark keeps its vertical presence
  // whichever one sets it. Array takes the larger cap despite being the wider
  // drawing: it builds its N out of discrete dots, and at the ~180px an avatar
  // is actually shown at, a smaller setting lets neighbouring dots antialias
  // into each other until the strokes go solid and the point of the face is
  // lost. It still clears the circle both services crop to with margin.
  //
  // Satoshi's weight sits below the weight body copy runs at, on purpose: the
  // site shifts its ladder up a step to correct a short x-height, and a
  // capital has no x-height to correct. Array is cut at 400 and 600 with
  // nothing between; 600 is the one that carries at icon sizes.
  const FACES = {
    satoshi: {
      family: "Satoshi",
      file: "satoshi-variable.woff2",
      range: "300 900",
      weight: 540,
      capRatio: 0.54,
    },
    array: {
      family: "Array",
      file: "array-600.woff2",
      range: "600",
      weight: 600,
      capRatio: 0.58,
    },
  };
  const FACE = FACES[faceKey];

  // Proportions of the canvas edge, so any size renders identically.
  const CAP_RATIO = FACE.capRatio; // N cap height
  const WEIGHT = FACE.weight;
  const COLUMNS = num("cols", 12); // grille perforations across the edge
  const DOT_ALPHA = num("alpha", 0.7);
  const DOT_RADIUS = num("dot", 0.0075);

  const canvas = document.getElementById("c");
  canvas.width = SIZE;
  canvas.height = SIZE;
  canvas.style.width = SIZE + "px";
  canvas.style.height = SIZE + "px";
  const ctx = canvas.getContext("2d");

  // The champagne metal grille of the headphones the palette is modeled on: an
  // even perforation field, spaced open so it reads as material rather than
  // pattern.
  // The field is deliberately more present than the same texture would be
  // in-app, and both numbers below are load-bearing for that. An avatar is
  // shown at ~180px and smaller, where a perforation this size lands under a
  // pixel: antialiasing then spreads it across its neighbours and drains the
  // contrast, so a token-quiet alpha renders as nothing at all. The dot has to
  // clear a pixel at display size and the alpha has to survive being averaged
  // with the background. Judge any change to either at 180px and 96px, not at
  // full size, where everything looks fine.
  const drawGrille = () => {
    const gap = SIZE / COLUMNS;
    ctx.fillStyle = PALETTE.primary;
    ctx.globalAlpha = DOT_ALPHA;
    for (let y = gap / 2; y < SIZE; y += gap) {
      for (let x = gap / 2; x < SIZE; x += gap) {
        ctx.beginPath();
        ctx.arc(x, y, DOT_RADIUS * SIZE, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
  };

  // Centers on the N's own ink on both axes. Neither alignment does this by
  // itself: `alphabetic` sits the glyph on its baseline, and `center` centers
  // the advance width, which only matches the ink when the two sidebearings
  // are equal. Satoshi's are; Array's are 0 and 100, so trusting the advance
  // hangs its N a visible step to the left of the tile.
  const drawMark = () => {
    let fontSize = SIZE;
    ctx.font = `${WEIGHT} ${fontSize}px ${FACE.family}`;
    const probe = ctx.measureText("N");
    const capAtProbe = probe.actualBoundingBoxAscent + probe.actualBoundingBoxDescent;
    fontSize = (CAP_RATIO * SIZE * fontSize) / capAtProbe;

    ctx.font = `${WEIGHT} ${fontSize}px ${FACE.family}`;
    ctx.textAlign = "center";
    ctx.textBaseline = "alphabetic";
    const m = ctx.measureText("N");
    const inkCenterY = (m.actualBoundingBoxDescent - m.actualBoundingBoxAscent) / 2;
    const inkCenterX = (m.actualBoundingBoxRight - m.actualBoundingBoxLeft) / 2;
    ctx.fillStyle = PALETTE.primary;
    ctx.fillText("N", SIZE / 2 - inkCenterX, SIZE / 2 - inkCenterY);
  };

  const render = () => {
    ctx.fillStyle = PALETTE.background;
    ctx.fillRect(0, 0, SIZE, SIZE);
    if (SHOW_GRILLE) drawGrille();
    drawMark();
    document.title = "ready";
  };

  const font = new FontFace(FACE.family, `url(${FACE.file}) format('woff2')`, {
    weight: FACE.range,
  });
  font.load().then((loaded) => {
    document.fonts.add(loaded);
    render();
  });
</script>
