services:
  api:
    build: ./backend
    command: >
      sh -c "uv run alembic upgrade head &&
             uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@host.docker.internal:54322/postgres
      LASTFM_API_KEY: ${LASTFM_API_KEY:?set in .env}
      TICKETMASTER_API_KEY: ${TICKETMASTER_API_KEY:?set in .env}
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:?set in .env}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET:?set in .env}
      SPOTIFY_REFRESH_TOKEN: ${SPOTIFY_REFRESH_TOKEN:?set in .env}
      SUPABASE_URL: http://host.docker.internal:54321
      SUPABASE_ISSUER: http://127.0.0.1:54321/auth/v1
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:-}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./backend/app:/app/app
      - ./backend/cli:/app/cli
      - ./backend/migrations:/app/migrations
      - ./backend/tests:/app/tests
    extra_hosts:
      - "host.docker.internal:host-gateway"

  web:
    build: ./frontend
    environment:
      API_URL: http://api:8000
      NEXT_PUBLIC_SUPABASE_URL: http://host.docker.internal:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-sb_publishable_ACJWlzQHlZjBrEguHvfOxg_3BJgxAaH}
    ports:
      - "${WEB_PORT:-3000}:3000"
    volumes:
      - ./frontend/src:/app/src
    depends_on:
      - api

  worker:
    build: ./backend
    # Exec form (no `sh -c`), so a stop's SIGTERM reaches the worker and it
    # hands its in-flight run back to the queue instead of being killed.
    command: ["uv", "run", "watchfiles", "--filter", "python", "python -m app.worker", "app"]
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@host.docker.internal:54322/postgres
      NIGHTLY_SYNC_ENABLED: ${NIGHTLY_SYNC_ENABLED:-false}
      LASTFM_API_KEY: ${LASTFM_API_KEY:?set in .env}
      TICKETMASTER_API_KEY: ${TICKETMASTER_API_KEY:?set in .env}
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:?set in .env}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET:?set in .env}
      SPOTIFY_REFRESH_TOKEN: ${SPOTIFY_REFRESH_TOKEN:?set in .env}
    volumes:
      - ./backend/app:/app/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # The api applies migrations on startup; starting after it keeps a fresh
    # stack's worker from polling a table that doesn't exist yet.
    depends_on:
      - api
