<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- The bot-account avatar's mark at tab size; paired with icon-light.svg,
       which differs only in the two fills below. Palette, grille and the N's
       cap-height sizing mirror brand/avatar.html; the path is Satoshi N at
       wght 540. See docs/theme.md. -->
  <style>
    .bg { fill: #140e0b }
    .mark { fill: #cfaa7f }
  </style>
  <defs>
    <pattern id="grille" width="8.3333" height="8.3333" patternUnits="userSpaceOnUse">
      <circle class="mark" cx="4.1667" cy="4.1667" r="0.75" opacity="0.7" />
    </pattern>
    <clipPath id="tile">
      <rect width="100" height="100" rx="20" />
    </clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect class="bg" width="100" height="100" />
    <rect width="100" height="100" fill="url(#grille)" />
  </g>
  <path class="mark" d="M36.39 77H28.71V23H36.43L65.78 67.35H63.61V23H71.29V77H63.61L34.25 32.68H36.39Z" />
</svg>
